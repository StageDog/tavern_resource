name: sync

on:
  workflow_run:
    workflows:
      - bundle
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: kujov/gitlab-sync@ec05efff6dfa33ffb5398d31caf3a256e5a9ea34
        with:
          gitlab_url: https://gitgud.io/StageDog/tavern_resource.git
          username: StageDog
          gitlab_pat: ${{ secrets.GITLAB_PAT }}
          force_push: true
